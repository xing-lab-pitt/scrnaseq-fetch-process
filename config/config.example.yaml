# ---------------------------------------------------------------------------
# scRNA-seq STARsolo pipeline config  (TEMPLATE)
#
#   cp config/config.example.yaml config/config.yaml   # then edit the paths
#
# Chemistry defaults reproduce 10x Chromium 3' v3. Replace every <PLACEHOLDER>
# with a path on YOUR system. config/config.yaml is gitignored so your local
# paths are never committed.
# ---------------------------------------------------------------------------

# Only used when run_downstream: true (points at run_pipeline.py). ncbi_utils.py
# is vendored in workflow/scripts, so this is NOT needed for the core pipeline.
# Leave as-is if you don't run downstream analysis.
tools_dir: "/path/to/downstream/scripts"
requirements_txt: "requirements-pipeline.txt"   # checked at preflight (repo-relative is fine)

# Sample sheet from workflow/scripts/prepare_runs.py (or hand-written).
# Columns: sample  srr  source  fastq_1_url  fastq_2_url  fastq_1_md5  fastq_2_md5  chemistry  strand
samples_tsv: "config/samples.tsv"

# sra-tools bin dir, used ONLY for runs whose `source` is "sra" (not mirrored on
# ENA). Provides prefetch + fasterq-dump. Leave "" if all runs come from ENA, or
# if prefetch/fasterq-dump are already on your PATH.
sra_tools_bin: ""

workdir: "results"
threads: 8

# Run a downstream scanpy pipeline (run_pipeline.py) on the merged matrix?
run_downstream: false

reference:
  # Human GRCh38 (Ensembl 98 primary assembly) in the reference example below.
  # star_index below is an OPTIONAL prebuilt-index HINT/path, not the index the
  # aligner reads directly. rule resolve_star_index probes what the pipeline's STAR
  # speaks (genomeVersion) and:
  #   * hint matches   -> symlinks it into <workdir>/star_index (instant, no rebuild)
  #   * hint mismatches / not yet an index, but the PATH is set -> builds a fresh
  #     index INTO that path (so it is durable and reused next run — the next run's
  #     match branch just symlinks it, no rebuild), then symlinks <workdir>/star_index
  #     -> it. Point this at a writable dir you want to keep the built index in.
  #   * star_index "" -> always builds into <workdir>/star_index (ephemeral).
  # Either way the aligner only reads <workdir>/star_index, so the index and aligner
  # come from the same STAR (no "Genome version INCOMPATIBLE" aborts). fasta/gtf must
  # be valid whenever a (re)build might be needed.
  #
  # Obtain a reference, e.g.:
  #   fasta: ftp://ftp.ensembl.org/pub/release-98/fasta/homo_sapiens/dna/
  #          Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz
  #   gtf:   ftp://ftp.ensembl.org/pub/release-98/gtf/homo_sapiens/
  #          Homo_sapiens.GRCh38.98.gtf.gz
  fasta: "/path/to/GRCh38/Homo_sapiens.GRCh38.dna.primary_assembly.fa"
  gtf: "/path/to/GRCh38/Homo_sapiens.GRCh38.98.gtf"
  star_index: "/path/to/GRCh38/STAR"   # prebuilt-index HINT, or a writable dir to build+keep the index in (or "" to build ephemerally); resolver validates genomeVersion
  sjdb_overhang: 100

# 10x Chromium 3' v3 (defaults below). Other chemistries:
#   v2       -> umi_len 10, whitelist 737K-august-2016.txt (R1 is 26bp)
#   v4/GEM-X -> SAME geometry as v3 (umi_len 12); ONLY swap the whitelist to
#               3M-3pgex-may-2023.txt. (v3 and v4 can't be told apart by read
#               length — the whitelist is what selects the chemistry.)
# Whitelists ship with Cell Ranger (lib/python/cellranger/barcodes/), or:
#   v2: 737K-august-2016.txt (26bp barcode: 16 CB + 10 UMI)
#   v3: 3M-february-2018.txt (28bp barcode: 16 CB + 12 UMI)
#   v4: 3M-3pgex-may-2023.txt (28bp barcode: 16 CB + 12 UMI)
# NOTE: barcode+UMI and cDNA are separate FASTQs for all 10x 3' chemistries, so
# the starsolo rule uses the standard two-file form (cDNA first, barcode second)
# and does NOT use --soloBarcodeMate/--clip5pNbases (no barcode_mate/clip5p keys).
chemistry:
  whitelist: "/path/to/10x_whitelist/3M-february-2018.txt"   # v3 (28bp barcode)
  cb_start: 1
  cb_len: 16
  umi_start: 17
  umi_len: 12   # v2: 10, v3/v4: 12
  # --soloStrand: distinguishes 10x 3' vs 5' (read length / whitelist CANNOT).
  # Forward = 10x 3' GEX (default); set Reverse for 10x 5' GEX. Overridable
  # per-sample via the `strand` column in samples.tsv. If unsure: check the
  # GEO/SRA record for "5'"/"3'", then confirm on Solo.out/Gene/Summary.csv
  # "Reads Mapped to Gene" (wrong strand collapses it; the QC gate catches it).
  strand: Forward

# Counted feature (per-run toggle): Gene = exonic counts (standard scRNA-seq);
# GeneFull = full gene body incl. introns (single-nucleus / snRNA-seq — nuclear
# RNA is mostly unspliced pre-mRNA). The starsolo rule emits `--soloFeatures
# {feature} Velocyto`, so the Velocyto spliced/unspliced/ambiguous layers are
# produced in both modes. Set GeneFull for single-nucleus data; leave Gene otherwise.
feature: Gene

# --outSAMtype None (default): skip the alignment BAM to avoid large disk + I/O.
# Nothing in the core count pipeline consumes it — QC, to_h5ad (Gene/GeneFull
# counts + spliced/unspliced/ambiguous), merge, and MultiQC all read Solo.out
# matrices only; STARsolo computes the Velocyto layers internally, not from a BAM.
# If a downstream task needs read-level data (IGV, samtools, external velocyto/
# RNA-velocity, re-quantification), set "BAM SortedByCoordinate" to emit a
# coordinate-sorted BAM (Aligned.sortedByCoord.out.bam); coordinate sorting can
# need extra RAM, so add "--limitBAMsortRAM <bytes>" if STAR reports a sort OOM.
# NOTE: --soloFeatures is set by the starsolo rule (from `feature` above), so it
# must NOT appear here — otherwise STARsolo would receive it twice.
starsolo_extra: >-
  --soloType CB_UMI_Simple
  --readFilesCommand zcat
  --outSAMtype None

# Deterministic QC gate on STARsolo Gene/Summary.csv. Thresholds live HERE
# (version-controlled), not chosen at runtime, so pass/fail is reproducible.
qc:
  mode: strict          # strict = stop the run if any sample fails; warn = report only
  min_valid_barcodes: 0.70
  min_reads_mapped_gene: 0.50
  min_estimated_cells: 100
